spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/survival?connectionTimeZone=America/New_York&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

management.endpoints.web.exposure.include=health,info,mappings
management.endpoints.jmx.exposure.include=health,info,mappings
